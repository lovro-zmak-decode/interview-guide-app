{% extends "base.html" %}
{% block title %}First-time setup{% endblock %}
{% block auth_content %}
<p class="eyebrow">First-time setup</p>
<h1>Create the admin account</h1>
<p class="lede">There are no accounts yet. The first one becomes the superadmin and can create
  accounts for everyone else.</p>
<form action="{{ url_for('auth.setup') }}" method="post">
  <label class="field">
    <span class="label">Email</span>
    <input type="email" name="email" required autofocus autocomplete="username" placeholder="name@decode.agency">
  </label>
  <label class="field">
    <span class="label">Password</span>
    <input type="password" name="password" required minlength="8" autocomplete="new-password">
    <span class="hint">At least 8 characters.</span>
  </label>
  <button type="submit" class="btn btn-primary btn-lg btn-block">Create account</button>
</form>
{% endblock %}
