{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
<h1>Log in</h1>
<p class="lede">Accounts are invite-only. If you don't have one, ask an admin.</p>

<!-- Google OAuth Button -->
<div style="margin-bottom: 1.5rem;">
  <a href="{{ url_for('google_auth.login') }}" class="btn btn-secondary btn-lg btn-block">
    Sign in with Google
  </a>
</div>
<div style="text-align: center; margin: 1rem 0; color: var(--text-secondary);">or</div>

<form action="{{ url_for('auth.login') }}" method="post">
  <label class="field">
    <span class="label">Email</span>
    <input type="email" name="email" required autofocus autocomplete="username" placeholder="name@decode.agency">
  </label>
  <label class="field">
    <span class="label">Password</span>
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
</form>
{% endblock %}
